# Builds the site on every pull request, so a broken build is caught before it
# reaches main and goes live.
name: Build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Check the page and its 3D chunk were written
        run: |
          test -s .output/public/index.html
          grep -q 'id="map"' .output/public/index.html
          ls .output/public/_nuxt/*.js > /dev/null
